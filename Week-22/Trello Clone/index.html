<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trello-Clone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="board-container">
        <div class="column" id="todo">
            <h1>TODO</h1>
            <div class="tasks" id="todo-task"></div>
            <input type="text" class="task-input" id="todo-input" placeholder="Add Task">
            <button class="Add-btn" onclick="addTask('todo')">Add Task</button>
        </div>
        <div class="column" id="doing">
            <h1>DOING</h1>
            <div class="tasks" id="doing-task"></div>
            <input type="text" class="task-input" id="doing-input" placeholder="Add Task">
            <button class="Add-btn" onclick="addTask('doing')">Add Task</button>
        </div>
        <div class="column" id="done">
            <h1>DONE</h1>
            <div class="tasks" id="done-task"></div>
            <input type="text" class="task-input" id="done-input" placeholder="Add Task">
            <button class="Add-btn" onclick="addTask('done')">Add Task</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
