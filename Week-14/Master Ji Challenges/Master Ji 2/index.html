<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Ji Project - Youtube Clone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<!--
Instructions
YouTube Video Listing
Build a YouTube-style video listing page that fetches and displays videos from the FreeAPI YouTube endpoint
Requirements
Fetch and display a list of YouTube videos
Show video thumbnails, titles, and channel names
Click on a video to open it in YouTube
Add a search bar to filter videos (filteration should be done on frontend without any additional api calls)
Implement a grid layout for better Ul
API Endpoint
GET https://api.freeapi.app/api/v1/public/youtube/videos
Documentation
https://freeapi.hashnode.space/api-guide/apireference/getYoutubeVideos -->
    <header class="header">
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube"
                height="24">
        </div>
        <div class="searchContainer">
            <input type="text" id="searchInput" placeholder="Search Videos or Channels...">
            <button id="searchBtn">🔍</button>
        </div>
        <div class="profile">
            <div class="avatar"></div>
        </div>
    </header>
    <main>
        <div class="video-grid" id="videoGrid">
            <h2 id="loadingText">Loading videos...</h2>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
